# Photo library for post graphics (AI characters created for Bloom Models).
# instagram_ok: false keeps a photo off Instagram graphics (too close to "suggestive" for Meta's rules); it can
# still be used on the website. ai_generated: true makes the agent require an "AI" note on the graphic and in the
# caption (Meta and honest recruiting both need it). focus_y: where the face is, 0 = top, 1 = bottom (used when cropping).
photos:
