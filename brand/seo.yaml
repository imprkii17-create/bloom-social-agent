# What we want to be found for. Used by the SEO checks and by the marketing agent.
#
# These keyword lists are starting hypotheses (no keyword tool has volume data for small Hungarian queries).
# Once Google Search Console is connected, the weekly report shows the searches people REALLY use to find the
# site, and the agent proposes changes here based on that data.

site:
  primary_keyword:
    hu: online modell munka
    en: online modeling jobs
  keywords:
    hu:
      - online modell munka
      - webkamerás modell munka
      - webcam modell munka
      - streamelő modell munka
      - streaming modell
      - online modell állás
      - modell munka budapest
      - modellügynökség budapest
      - otthonról végezhető munka
      - rugalmas munkaidő magas kereset
    en:
      - online modeling jobs
      - webcam model jobs budapest
      - streaming model
      - online model agency budapest
      - modeling jobs budapest
      - work from home budapest

  # Decided 2026-10-13 (owner): "webkamerás / webcam" is used on the WEBSITE (the guide pages in site/src/guides and
  # one FAQ answer), because that is what people search for. It stays OFF Instagram, ads and post images
  # (brand/rules.md). Each guide page lists its own target keywords in its front matter.
  undecided: []

instagram:
  # Instagram search reads the Name field, username, bio, captions, alt text and hashtags.
  name_field: "Bloom Models | Online Modeling"
  keywords:
    hu: [online modell, modellügynökség, budapest, rugalmas munka, streaming]
    en: [online modeling, model agency, budapest, flexible work, streaming]
  # Hashtags we rotate through (max 5 per post). Keep them specific; giant generic tags bring the wrong audience.
  hashtag_pool:
    - "#bloommodels"
    - "#onlinemodell"
    - "#modellmunka"
    - "#budapestmunka"
    - "#rugalmasmunka"
    - "#otthonimunka"
    - "#budapest"
    - "#onlinemodeling"
    - "#modelagency"
    - "#budapestjobs"

# Other Budapest agencies recruiting for the same work. The agent watches their visibility (with Claude switched on).
competitors: []
