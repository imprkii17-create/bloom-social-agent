        headline: What your first week looks like
        items: [A short chat and your questions, Free training at the studio, Your first stream — the team is there, "Your own schedule, about 20 hours a week"]
    caption_hu: |
      Online modell munka, lépésről lépésre: így néz ki az első heted nálunk. 🌸

      Nincs meglepetés, nincs nyomás. Először beszélgetünk, mindent megkérdezhetsz. Utána betanítunk a stúdióban: technika, fények, tempó. Az első streamednél a csapat ott van melletted, a beosztásodat pedig veled együtt tervezzük.

