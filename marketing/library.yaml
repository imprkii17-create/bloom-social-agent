# Ready-made, evergreen posts. Without a Claude API key, the weekly marketing run drafts next week's posts from
# here (least recently used first) and draws their graphics. With a key, Claude writes fresh posts instead and
# uses these as examples of the voice.
#
# Every entry follows brand/rules.md and brand/facts.yaml. Captions: Hungarian first, then English.

posts:
