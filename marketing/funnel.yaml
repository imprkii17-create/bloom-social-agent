# Your weekly numbers. Add one entry every Monday (takes a minute, works in the GitHub app).
# The agent uses them to find the bottleneck: is it reach, interest, the profile, or the application itself?
#
# applications: form submissions that week (Formspree dashboard)
# replied_24h:  how many of them got an answer within 24 hours
# interviews:   first conversations held
# started:      people who started working
# top_referrer: most common answer to "Who referred you?" (optional)
# by_source:    applications per channel. Each Formspree submission has a "source" field, e.g.
#               "google / cpc / okt-search", "meta / paid / okt-meta", "ref:Anna", "from:l.instagram.com", "direct"
# spend:        what each paid channel cost that week (Ft), and referral bonuses paid

# Copy the example below (remove the # signs), one block per week, newest last.
