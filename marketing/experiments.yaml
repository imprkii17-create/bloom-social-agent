# Experiments the marketing agent runs and evaluates. You can edit or stop any of them.
# The first three are the October launch campaigns (see the campaign plan). Log their results per channel in
# marketing/funnel.yaml (by_source and spend), so the agent can compare cost per application.
experiments:
- id: 20261015-referral
  title: Referral program "Ajánld a Bloomot"
  hypothesis: People referred by someone they trust apply more often and start more often than any paid channel, at a
    cost only paid after a referred person actually starts.
  metric: applications and starts with a referrer or ref:<code> source; bonus paid per start
  start: '2026-10-15'
  end: '2026-11-12'
  status: running
  result: ''
- id: 20261016-google-search
  title: Google Search ads, Budapest, about 300 Ft a day
  hypothesis: People already searching for online modelling or flexible work in Budapest apply at a cost per
    application below 10,000 Ft.
  metric: applications with source google / cpc / okt-search; spend; cost per application
  start: '2026-10-16'
  end: '2026-11-13'
  status: running
  result: ''
- id: 20261019-meta-ads
  title: Facebook + Instagram ads (Ads Manager, Employment category), 7 days at about $2 a day
  hypothesis: A clean recruitment ad (no faces, no earnings figures) gets approved and brings link clicks and at least
    one application at a cost per application below 10,000 Ft. If Meta rejects it, we stop paid Meta and stay organic.
  metric: ad approved or rejected; link clicks; applications with source meta / paid / okt-meta; spend
  start: '2026-10-19'
  end: '2026-10-25'
  status: running
  result: ''
