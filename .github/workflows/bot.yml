name: Telegram bot

# Every 5 minutes (GitHub sometimes runs it a few minutes late): answer new Telegram messages.
# Does nothing until the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets exist (SETUP.md, step 15).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps .
      - name: Answer new messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          BOT_MAX_USD_PER_RUN: ${{ vars.BOT_MAX_USD_PER_RUN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: bloom bot poll
      - name: Save approvals made in Telegram
        if: always()
        run: 'scripts/commit-back.sh "bloom-agent: changes from Telegram" posts'
