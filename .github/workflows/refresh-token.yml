name: Refresh Instagram token

# Instagram tokens expire after 60 days. Refreshing weekly keeps them alive indefinitely.
on:
  schedule:
    - cron: "13 6 * * 1"   # Mondays 06:13 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-token
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps .
      - name: Refresh and store the token
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bloom refresh-token
      - name: Save token expiry date (not the token)
        if: success()
        run: 'scripts/commit-back.sh "bloom-agent: token refreshed" state'
