name: CI

# Runs on every push and pull request: code checks, then prepares and validates the post queue.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - run: pytest

  content:
    name: Prepare & validate posts
    needs: code
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps .
      - name: Convert images to Instagram-ready JPEG
        run: bloom prepare
      - name: Validate every post
        run: bloom validate
      - name: Save converted images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: 'scripts/commit-back.sh "bloom-agent: prepare media" posts'

  website:
    name: Build & check the website
    needs: code
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps .
      - name: Pull request — is site/public up to date?
        if: github.event_name == 'pull_request'
        run: bloom site build --check
      - name: Main — build site/public from site/src
        if: github.event_name != 'pull_request'
        run: bloom site build
      - name: SEO check of the built pages (fails on critical problems)
        run: bloom seo --quick --offline
      - name: Save the built website (Netlify deploys this commit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: 'scripts/commit-back.sh "bloom-agent: build website" site/public'

  review:
    name: Claude review of draft posts (optional)
    needs: content
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps .
      - name: Review drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: bloom review
