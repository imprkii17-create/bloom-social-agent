[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloom-agent"
version = "1.0.0"
description = "Bloom Models social media agent: validates, schedules and publishes approved posts to Instagram (and Facebook), refreshes tokens and writes weekly reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "Pillow>=10.3",
    "PyNaCl>=1.5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
bloom = "bloom_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["bloom_agent"]
ignore_missing_imports = true
